<!doctype html>

<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rapport du jour</title>
  <link rel="icon" href="img/icone.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="barre">
    <div class="marque">
      <span class="logo"><img src="img/logo-campanile.png" alt="Campanile"></span>    </div>
    <nav id="onglets" aria-label="Feuilles">
      <button data-vue="accueil">Accueil</button>
      <button data-vue="rapport">Rapport</button>
      <button data-vue="fdc">Femme de chambre</button>
      <button data-vue="plan">Plan de chambre</button>
      <button data-vue="pdj">PDJ</button>
      <button data-vue="recap">Historique</button>
      <button data-vue="reglages">Réglages</button>
    </nav>
    <div id="choix-affichage" class="choix-affichage" role="group" aria-label="Taille de l'affichage"></div>
    <button id="pastille-maj" class="pastille-maj" data-action="maj-ouvrir" hidden><span></span></button>
  </header>

  <div id="notice" class="notice" hidden role="status"></div>
  <main id="vue"></main>
  <div id="impression" class="nb"></div>
  <dialog id="dialogue"></dialog>
  <dialog id="maj-fenetre" aria-label="Installation d'une mise à jour"></dialog>
  <div id="apercu" hidden role="dialog" aria-modal="true" aria-label="Aperçu avant impression"></div>
  <div class="voile-depot">Déposez les rapports exportés (en français ou en anglais) pour les importer</div>

  <input type="file" id="fichier-import" accept=".xlsx,.xlsm,.csv" multiple hidden>
  <input type="file" id="fichier-restaurer" accept=".json,application/json" hidden>

  <script src="js/config.js"></script>
  <script src="js/changelog.js"></script>
  <script src="js/xlsx-reader.js"></script>
  <script src="js/calculs.js"></script>
  <script src="js/store.js"></script>
  <script src="js/maj.js"></script>
  <script src="js/buffet.js"></script>
  <script src="js/vues.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
